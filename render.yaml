# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: quickcheck-attendance-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_ENV
        value: production
